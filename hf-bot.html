<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HF Bot - POWDER-RANGER AI Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Consolas, monospace;
            background: linear-gradient(135deg, #0d0000, #1a0000, #0d0000);
            color: #00FF88;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #FFD700;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite;
            box-shadow: 0 0 8px #FFD700;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, -50px); }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #FF0000;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            color: #FF0000;
            text-shadow: 0 0 20px #FF0000;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(13, 17, 23, 0.5);
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            border: 1px solid;
            backdrop-filter: blur(5px);
        }

        .message.user .message-content {
            background: rgba(255, 0, 0, 0.2);
            border-color: #FF0000;
            color: #00FF88;
            text-align: right;
        }

        .message.assistant .message-content {
            background: rgba(255, 215, 0, 0.1);
            border-color: #FFD700;
            color: #FFD700;
        }

        .loading {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .input-area {
            padding: 20px;
            border-top: 2px solid #FF0000;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        select, input {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #FFD700;
            color: #FFD700;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #FF0000;
            box-shadow: 0 0 10px #FF0000;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #FFD700;
            border-radius: 4px;
            background: rgba(13, 17, 23, 0.9);
            color: #00FF88;
            font-size: 1rem;
        }

        #userInput:focus {
            border-color: #FF0000;
            box-shadow: 0 0 15px #FF0000;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #8b0000, #FF0000);
            border: 2px solid #FFD700;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            font-family: 'Courier New', Consolas, monospace;
        }

        button:hover {
            background: #FF0000;
            box-shadow: 0 0 20px #FF0000;
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .model-info {
            font-size: 0.8rem;
            color: #00EEFF;
            padding: 5px 10px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 4px;
            border: 1px solid #00EEFF;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(13, 17, 23, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: #FF0000;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #FFD700;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .message-content { max-width: 85%; }
            .input-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <header>
            <h1>⚡ HF BOT INTERFACE</h1>
            <p class="subtitle">🤖 Hugging Face AI Inference | POWDER-RANGER Edition</p>
        </header>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-area">
            <div style="width: 100%;">
                <div class="controls">
                    <select id="modelSelect">
                        <option value="gpt2">GPT-2</option>
                        <option value="mistral">Mistral 7B</option>
                        <option value="llama">Llama 2 7B</option>
                        <option value="falcon">Falcon 7B</option>
                    </select>
                    <input type="number" id="tokenInput" placeholder="Max tokens (default: 100)" min="1" max="1000" value="100">
                    <div class="model-info" id="modelInfo">Ready to chat</div>
                </div>
                <div class="input-group">
                    <input type="text" id="userInput" placeholder="Type your message here... (Press Enter or click Send)">
                    <button id="sendBtn">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        let HF_TOKEN = localStorage.getItem('HF_TOKEN') || '';
        let currentModel = 'gpt2';
        const modelEndpoints = {
            'gpt2': 'gpt2',
            'mistral': 'mistralai/Mistral-7B-Instruct-v0.1',
            'llama': 'meta-llama/Llama-2-7b-chat-hf',
            'falcon': 'tiiuae/falcon-7b-instruct'
        };

        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const tokenInput = document.getElementById('tokenInput');
        const modelInfo = document.getElementById('modelInfo');

        // Initialize particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // Setup token via console: setHFToken("your-token-here")
        window.setHFToken = function(token) {
            HF_TOKEN = token;
            localStorage.setItem('HF_TOKEN', token);
            modelInfo.textContent = '✓ Token configured. Ready to chat!';
            modelInfo.style.borderColor = '#00FF88';
            modelInfo.style.background = 'rgba(0, 255, 136, 0.2)';
        };

        // Add message to chat
        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            msgDiv.appendChild(content);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Show loading indicator
        function showLoading() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            msgDiv.id = 'loadingMsg';
            
            const content = document.createElement('div');
            content.className = 'message-content loading';
            content.innerHTML = '<span></span><span></span><span></span>';
            
            msgDiv.appendChild(content);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Remove loading indicator
        function removeLoading() {
            const loading = document.getElementById('loadingMsg');
            if (loading) loading.remove();
        }

        // Query Hugging Face API
        async function queryHFAPI(userMessage) {
            if (!HF_TOKEN) {
                addMessage('❌ No HF token configured. Use setHFToken("your-token") in console.', false);
                return;
            }

            addMessage(userMessage, true);
            showLoading();

            try {
                const response = await fetch(
                    `https://api-inference.huggingface.co/models/${modelEndpoints[currentModel]}`,
                    {
                        headers: { Authorization: `Bearer ${HF_TOKEN}` },
                        method: 'POST',
                        body: JSON.stringify({
                            inputs: userMessage,
                            parameters: {
                                max_new_tokens: parseInt(tokenInput.value) || 100,
                                temperature: 0.7
                            }
                        }),
                    }
                );

                const result = await response.json();
                removeLoading();

                if (result.error) {
                    addMessage(`⚠️ Error: ${result.error}`, false);
                } else if (Array.isArray(result) && result[0]) {
                    const generated = result[0].generated_text || result[0];
                    addMessage(generated, false);
                } else {
                    addMessage(JSON.stringify(result, null, 2), false);
                }
            } catch (error) {
                removeLoading();
                addMessage(`❌ Request failed: ${error.message}`, false);
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) {
                queryHFAPI(text);
                userInput.value = '';
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        modelSelect.addEventListener('change', (e) => {
            currentModel = e.target.value;
            modelInfo.textContent = `✓ Model: ${e.target.options[e.selectedIndex].text}`;
        });

        // Initial welcome message
        addMessage('🚀 Welcome to HF Bot! Configure your Hugging Face token in the browser console:\n\nsetHFToken("your-hf-token")\n\nThen start chatting!', false);
        
        if (HF_TOKEN) {
            modelInfo.textContent = '✓ Token found in storage. Ready to chat!';
            modelInfo.style.borderColor = '#00FF88';
            modelInfo.style.background = 'rgba(0, 255, 136, 0.2)';
        } else {
            modelInfo.textContent = '⚠ Token not configured. Use console to set token.';
        }
    </script>
</body>
</html>
