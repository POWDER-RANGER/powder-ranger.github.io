<style>
html,body{min-height:100%}
body{margin:0;background:#0a0000;color:#F2E8E8;font-family:'Oswald',Impact,'Arial Narrow',sans-serif;text-transform:uppercase}
.wrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.panel{width:min(760px,100%);border:3px solid #E31C23;background:#120000;box-shadow:16px 16px 0 #8B0000}
.inner{padding:36px}
.stripe{height:8px;background:#E31C23;margin-bottom:24px}
.kicker{font-family:'Share Tech Mono',monospace;color:#E31C23;font-size:.72rem;letter-spacing:.2em;margin-bottom:10px}
h1{font-size:clamp(5rem,18vw,10rem);line-height:.8;margin:0 0 18px;color:#F2E8E8}
h1 span{color:#E31C23}
p{max-width:40rem;color:#A08080;line-height:1.6}
.actions{display:flex;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;border:3px solid #E31C23;padding:14px 18px;margin-right:-3px;text-decoration:none;color:#F2E8E8;font-family:'Share Tech Mono',monospace;letter-spacing:.12em}
.btn.primary{background:#E31C23;color:#fff}
.btn:hover{background:#fff;color:#0a0000}
footer{margin-top:18px;font-family:'Share Tech Mono',monospace;font-size:.68rem;color:#A08080;letter-spacing:.12em}
@media(max-width:640px){.inner{padding:24px}.actions{gap:3px}.btn{margin:0}}
</style>
</head>
<body>
<div class="wrap">
  <main class="panel">
    <div class="inner">
      <div class="stripe"></div>

        <a class="btn" href="/pages.html">LIVE PAGES</a>
        <a class="btn" href="https://github.com/POWDER-RANGER">GITHUB</a>
      </div>
      <footer>POWDER-RANGER · CONSTRUCTIVIST PAGES BASELINE · 2026</footer>
    </div>
  </main>
</div>
